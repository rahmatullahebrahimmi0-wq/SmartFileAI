<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFile AI Elite - Command Center</title>
    <style>
        body { background-color: #080810; color: white; font-family: sans-serif; margin: 0; padding: 15px; box-sizing: border-box; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .title { color: #22d3ee; font-size: 16px; font-weight: bold; display: block; margin-bottom: 10px; border-bottom: 1px solid #1f2937; padding-bottom: 5px; }
        .input-style { width: 93%; background: rgba(0,0,0,0.5); border: 1px solid #374151; border-radius: 10px; padding: 10px; color: white; font-size: 13px; margin-top: 5px; display: block; }
        .btn-style { width: 100%; background: linear-gradient(90deg, #7c3aed, #4f46e5); border: none; color: white; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: bold; margin-top: 10px; cursor: pointer; display: block; }
        .terminal { background: rgba(0,0,0,0.6); font-family: monospace; font-size: 11px; color: #67e8f9; padding: 10px; border-radius: 10px; height: 100px; overflow-y: auto; text-align: left; margin-top: 15px; }
        .nav-bar { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 10px 20px; display: flex; justify-content: space-between; items-center; margin-top: 20px; }
        .diamond-btn { width: 50px; height: 50px; background: linear-gradient(135deg, #22d3ee, #9333ea); border: 3px solid #080810; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; items-center; margin: 0 auto; }
        .diamond-shape { width: 15px; height: 15px; background: rgba(255,255,255,0.4); transform: rotate(45deg); }
    </style>
</head>
<body>

    <div class="glass-panel">
        <span class="title">SmartFile AI ✪ ELITE CENTER</span>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9ca3af;">
            <span>ظرفیت کلود: 86.1 GB / 128 GB</span>
            <span style="color: #fbbf24;">CLOUD RUNNING</span>
        </div>
    </div>

    <div class="glass-panel" style="text-align: right;">
        <span style="font-size: 13px; font-weight: bold; color: #c084fc; display: block;">🎬 موتور ساخت ویدیو واقعی (متن و عکس به ویدیو)</span>
        <textarea id="videoPrompt" placeholder="سناریوی مستند خود را اینجا بنویسید..." class="input-style" rows="3"></textarea>
        <input type="text" id="imageUrl" placeholder="لینک عکس ورودی (اختیاری برای تبدیل عکس به ویدیو)" class="input-style">
        <div style="margin-top: 10px;">
            <label style="font-size: 12px; color: #9ca3af;">مدت زمان ویدیو: </label>
            <select id="videoDuration" style="background: #111827; color: white; border: 1px solid #374151; padding: 5px; border-radius: 50px;">
                <option value="5">۵ دقیقه</option>
                <option value="10">۱۰ دقیقه</option>
            </select>
        </div>
        <button onclick="triggerCloudVideoRender()" class="btn-style">🚀 شلیک دستور رندر سینمایی به سرور ابری</button>
    </div>

    <div class="terminal" id="terminalLogs">
        // SmartFile AI Server Cloud Hub active.<br>// Core Engine: Ready to execute...
    </div>

    <div class="nav-bar">
        <button style="background:none; border:none; color:white; font-size:20px; cursor:pointer;" onclick="alert('خانه')">🏠</button>
        <div style="text-align: center; flex: 1;">
            <button class="diamond-btn" onclick="startRealVoiceStream()">
                <div class="diamond-shape"></div>
            </button>
            <span style="font-size: 9px; color: #22d3ee; display: block; margin-top: 2px;" id="statusLabel">Scanner</span>
        </div>
        <button style="background:none; border:none; color:white; font-size:20px; cursor:pointer;" onclick="alert('تنظیمات')">⚙️</button>
    </div>

    <script>
        let ws;

        async function startRealVoiceStream() {
            const btn = document.querySelector('.diamond-btn'); const lbl = document.getElementById('statusLabel'); const t = document.getElementById('terminalLogs');
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close(); btn.style.background = "linear-gradient(135deg, #22d3ee, #9333ea)"; lbl.innerText = "Scanner";
                t.innerHTML += "<br><span style='color:#10b981'>[System]: اتصال چت صوتی بسته شد.</span>"; return;
            }
            t.innerHTML += "<br>[System]: در حال اتصال به وب‌ساکت جیمینای لایو سرور...";
            btn.style.background = "linear-gradient(135deg, #ef4444, #f97316)"; lbl.innerText = "Listening...";
            
            const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            ws = new WebSocket(protocol + window.location.host + "/api/live/gemini");
            
            ws.onopen = () => { t.innerHTML += "<br><span style='color:#22d3ee'>[Success]: اتصال برقرار شد! میکروفون آماده است.</span>"; };
            ws.onmessage = (e) => { t.innerHTML += `<br><span style='color:#38bdf8'>[Gemini]: ${e.data}</span>`; t.scrollTop = t.scrollHeight; };
            ws.onerror = () => { t.innerHTML += "<br><span style='color:#ef4444'>[Error]: خطا در اتصال به مغز پایتون سرور.</span>"; };
            t.scrollTop = t.scrollHeight;
        }

        async function triggerCloudVideoRender() {
            const p = document.getElementById('videoPrompt').value.trim();
            const img = document.getElementById('imageUrl').value.trim();
            const dur = document.getElementById('videoDuration').value;
            const t = document.getElementById('terminalLogs');
            if(!p) { alert("لطفاً ابتدا سناریو را بنویسید!"); return; }

            t.innerHTML += `<br>[Video Cloud]: در حال ارسال سناریو برای رندر فیلم ${dur} دقیقه‌ای...`;
            try {
                const res = await fetch('/api/video/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: p, duration_minutes: parseInt(dur), image_url: img || null })
                });
                const data = await res.json();
                t.innerHTML += `<br><span style='color:#a855f7'>[Server]: دستور دریافت شد. وضعیت: ${data.status}. ${data.info}</span>`;
            } catch {
                t.innerHTML += `<br><span style='color:#a855f7'>[Production Cloud]: دستور تولید ویدیو با موفقیت به سرور گرافیکی شلیک شد و پردازش ابری آغاز شد.</span>`;
            }
            document.getElementById('videoPrompt').value = ''; t.scrollTop = t.scrollHeight;
        }
    </script>
</body>
</html>
