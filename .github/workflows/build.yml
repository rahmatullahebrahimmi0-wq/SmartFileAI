name: Build SmartFile AI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate project files
        run: python setup_smartfile.py

      - name: Verify project structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== SmartFileAI ==="
          ls -la SmartFileAI/
          echo "=== SmartFileAI/app ==="
          ls -la SmartFileAI/app/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          sudo mkdir -p /opt/android-sdk
          cd /opt/android-sdk
          sudo chown $USER:$USER /opt/android-sdk
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/latest/ 2>/dev/null || true
          mv cmdline-tools/lib cmdline-tools/latest/ 2>/dev/null || true
          mv cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
          ls -la cmdline-tools/latest/

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=/opt/android-sdk" > SmartFileAI/local.properties
          cat SmartFileAI/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Gradle daemon info
        working-directory: SmartFileAI
        run: gradle --version

      - name: Build Debug APK
        working-directory: SmartFileAI
        run: gradle assembleDebug --stacktrace --no-daemon --info 2>&1 | tail -100

      - name: Build Release AAB
        if: success()
        working-directory: SmartFileAI
        run: gradle bundleRelease --stacktrace --no-daemon

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartFileAI-AAB
          path: SmartFileAI/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartFileAI-Debug-APK
          path: SmartFileAI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
