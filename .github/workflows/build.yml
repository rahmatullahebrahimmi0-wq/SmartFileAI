name: Build SmartFile AI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate project files
        run: python setup_smartfile.py

      - name: Verify project structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== SmartFileAI ==="
          ls -la SmartFileAI/
          echo "=== SmartFileAI/app ==="
          ls -la SmartFileAI/app/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: SmartFileAI
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Build Release AAB
        working-directory: SmartFileAI
        run: gradle bundleRelease --stacktrace --no-daemon

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartFileAI-AAB
          path: SmartFileAI/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartFileAI-Debug-APK
          path: SmartFileAI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
